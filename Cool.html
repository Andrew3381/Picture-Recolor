<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PNG Colour Converter</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
    background: #222;
    color: white;
}

input, button {
    margin: 10px;
    padding: 10px;
}

button {
    cursor: pointer;
    font-size: 16px;
}

canvas {
    display: block;
    max-width: 90%;
    margin: 25px auto;
    border: 2px solid white;

    background:
        repeating-conic-gradient(
            #ccc 0% 25%,
            white 0% 50%
        ) 50% / 20px 20px;
}

#download {
    display: none;
    padding: 12px 20px;
    background: white;
    color: black;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>PNG Colour Converter</h1>

<input type="file" id="file" accept="image/png">

<br>

<label>
    Target colour:
    <input type="color" id="colour" value="#ff0000">
</label>

<br>

<button id="convert" disabled>
    Convert
</button>

<canvas id="canvas"></canvas>

<a id="download" download="converted.png">
    Download PNG
</a>

<script>
const fileInput = document.getElementById("file");
const colourInput = document.getElementById("colour");
const convertButton = document.getElementById("convert");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    willReadFrequently: true
});

const download = document.getElementById("download");

let selectedImage = null;
let downloadURL = null;


// --------------------------------------------------
// RGB → HSL
// --------------------------------------------------

function rgbToHsl(r, g, b) {

    r /= 255;
    g /= 255;
    b /= 255;

    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);

    const difference = max - min;

    let h = 0;
    let s = 0;

    const l = (max + min) / 2;

    if (difference !== 0) {

        s =
            difference /
            (1 - Math.abs(2 * l - 1));

        if (max === r) {
            h =
                60 *
                (((g - b) / difference) % 6);
        }
        else if (max === g) {
            h =
                60 *
                ((b - r) / difference + 2);
        }
        else {
            h =
                60 *
                ((r - g) / difference + 4);
        }

        if (h < 0)
            h += 360;
    }

    return [h, s, l];
}


// --------------------------------------------------
// HSL → RGB
// --------------------------------------------------

function hslToRgb(h, s, l) {

    const c =
        (1 - Math.abs(2 * l - 1)) * s;

    const hp = h / 60;

    const x =
        c * (1 - Math.abs((hp % 2) - 1));

    let r = 0;
    let g = 0;
    let b = 0;

    if (hp < 1) {
        r = c;
        g = x;
    }
    else if (hp < 2) {
        r = x;
        g = c;
    }
    else if (hp < 3) {
        g = c;
        b = x;
    }
    else if (hp < 4) {
        g = x;
        b = c;
    }
    else if (hp < 5) {
        r = x;
        b = c;
    }
    else {
        r = c;
        b = x;
    }

    const m = l - c / 2;

    return [
        Math.round((r + m) * 255),
        Math.round((g + m) * 255),
        Math.round((b + m) * 255)
    ];
}


// --------------------------------------------------
// HEX → RGB
// --------------------------------------------------

function hexToRgb(hex) {

    return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
    };
}


// --------------------------------------------------
// LOAD PNG
// --------------------------------------------------

fileInput.addEventListener("change", () => {

    const file = fileInput.files[0];

    if (!file) {
        convertButton.disabled = true;
        return;
    }

    const img = new Image();

    img.onload = () => {

        selectedImage = img;

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(img, 0, 0);

        convertButton.disabled = false;

        download.style.display = "none";
    };

    img.src = URL.createObjectURL(file);
});


// --------------------------------------------------
// CONVERT
// --------------------------------------------------

convertButton.addEventListener("click", () => {

    if (!selectedImage)
        return;

    const target = hexToRgb(
        colourInput.value
    );

    // Get target hue
    const [targetHue] =
        rgbToHsl(
            target.r,
            target.g,
            target.b
        );

    const image = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const pixels = image.data;


    for (let i = 0; i < pixels.length; i += 4) {

        const r = pixels[i];
        const g = pixels[i + 1];
        const b = pixels[i + 2];

        const alpha = pixels[i + 3];

        // Completely transparent pixel
        if (alpha === 0)
            continue;


        const [h, s, l] =
            rgbToHsl(r, g, b);


        /*
         * Ignore grayscale pixels.
         *
         * This means white, black and grey
         * stay exactly as they are.
         */
        if (s < 0.05)
            continue;


        /*
         * CHANGE ONLY THE HUE.
         *
         * Saturation stays the same.
         * Lightness stays the same.
         *
         * Therefore:
         *
         * dark blue → dark target colour
         * light blue → light target colour
         * bright blue → bright target colour
         */
        const result =
            hslToRgb(
                targetHue,
                s,
                l
            );


        pixels[i] = result[0];
        pixels[i + 1] = result[1];
        pixels[i + 2] = result[2];

        // Transparency stays exactly the same
        pixels[i + 3] = alpha;
    }


    ctx.putImageData(
        image,
        0,
        0
    );


    // --------------------------------------------------
    // CREATE DOWNLOAD
    // --------------------------------------------------

    canvas.toBlob((blob) => {

        if (!blob)
            return;

        if (downloadURL)
            URL.revokeObjectURL(downloadURL);

        downloadURL =
            URL.createObjectURL(blob);

        download.href =
            downloadURL;

        download.download =
            "converted.png";

        download.style.display =
            "inline-block";

    }, "image/png");
});

</script>

</body>
</html>
